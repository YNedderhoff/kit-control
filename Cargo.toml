[workspace]
members = ["crates/core", "crates/cli", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
